<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JMK Voter List</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#172033;--muted:#667085;--line:#e5e9f0;--accent:#2457c5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Arial,sans-serif}
header{background:#173b7a;color:#fff;padding:20px 4%;}header h1{margin:0;font-size:24px}header p{margin:5px 0 0;color:#dbe6ff}
main{max-width:1500px;margin:22px auto;padding:0 16px}
.toolbar,.stats,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #15264a0a}
.stats{display:flex;gap:24px;flex-wrap:wrap}.stat strong{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
input,select,button{font:inherit;border:1px solid #cfd6e2;border-radius:8px;padding:10px;background:#fff;color:var(--ink);width:100%}
button{cursor:pointer;font-weight:600}.buttons{display:flex;gap:8px;margin-top:12px}.buttons button{width:auto}.buttons .active{background:var(--accent);color:#fff;border-color:var(--accent)}
#results{color:var(--muted);margin:0 0 12px}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:1050px;table-layout:auto}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}th{background:#edf2fb;position:sticky;top:0;z-index:1}tr:hover td{background:#f8faff}td.party-cell{min-width:230px}.party-editor{display:flex;align-items:center;gap:8px;min-width:205px}.party-editor input{width:130px;min-width:100px;flex:1}.party-editor button{width:auto;flex:0 0 auto;padding:8px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.vcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 2px 8px #15264a08}
.vcard h3{margin:0 0 10px;font-size:17px}.vcard .sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}.detail div{min-width:0}.detail small{display:block;color:var(--muted);font-size:11px}.detail span{overflow-wrap:anywhere}
.hidden{display:none!important}.empty{text-align:center;padding:35px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:600px){header h1{font-size:20px}.toolbar,.stats,.panel{padding:12px}.buttons button{flex:1}}
</style>
</head>
<body>
<header><h1>JMK Voter List</h1><p>Search and view voter details</p></header>
<main>
<section class="stats">
 <div class="stat"><strong id="total">0</strong><span>Total records</span></div>
 <div class="stat"><strong id="shown">0</strong><span>Displayed records</span></div>
</section>
<section class="toolbar">
 <div class="filters">
  <input id="snoSearch" placeholder="Search by S.No">
  <input id="nameSearch" placeholder="Search by Name">
  <select id="partyFilter"><option value="">All Parties</option></select>
  <select id="genderFilter"><option value="">All Genders</option></select>
  <select id="wardFilter"><option value="">All Wards</option></select>
 </div>
 <div class="buttons">
  <button id="gridBtn" class="active" type="button">Grid View</button>
  <button id="listBtn" type="button">List View</button>
  <button id="resetBtn" type="button">Reset Filters</button>
 </div>
</section>
<p id="syncStatus" style="color:#667085;margin:0 0 8px">Connecting to shared Party data...</p><p id="results" aria-live="polite"></p>
<section id="gridView" class="grid"></section>
<section id="listView" class="table-wrap hidden"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></section>
<div id="empty" class="empty hidden">No matching voter records found.</div>
</main>
<footer>JMK Voter List · Party updates are shared through Google Sheets</footer>
<script src="voter-data.js"></script>
<script>
const headers=window.VOTER_DATA.headers, records=window.VOTER_DATA.records;
const $=id=>document.getElementById(id);
const value=(r,k)=>String(r[k]??"");
const API_URL = "https://script.google.com/macros/s/AKfycbwS01V5XK0HlRzll_yDJE1LDFr-BsGtcoALuv-kcq5pNygyjX9SgwUTX_vqnHFEjgRO/exec";
let sharedParties = {};

function apiReady(){
  return API_URL.startsWith("https://script.google.com/") && !API_URL.includes("PASTE_");
}

function refreshPartyFilter(){
  const sel=$("partyFilter");
  const selected=sel.value;
  sel.innerHTML='<option value="">All Parties</option>';
  [...new Set(records.map(r=>value(r,"Party")).filter(Boolean))]
    .sort().forEach(v=>{
      const o=document.createElement("option");
      o.value=v;o.textContent=v;sel.appendChild(o);
    });
  sel.value=selected;
}

function loadSharedParties(){
  if(!apiReady()){
    $("syncStatus").textContent="Google Sheets connection is not configured.";
    render();return;
  }
  const cb="partyLoad_"+Date.now()+"_"+Math.floor(Math.random()*10000);
  const script=document.createElement("script");
  let finished=false;
  const cleanup=()=>{
    delete window[cb];
    if(script.parentNode) script.parentNode.removeChild(script);
  };
  window[cb]=(payload)=>{
    finished=true;cleanup();
    if(!payload || !payload.success){
      $("syncStatus").textContent="Could not load Party data: "+(payload?.message||"Unknown error");
      render();return;
    }
    sharedParties=payload.parties||{};
    records.forEach(r=>{
      const key=String(r["S.No"]).trim();
      if(Object.prototype.hasOwnProperty.call(sharedParties,key)){
        r.Party=sharedParties[key]||"";
      }
    });
    refreshPartyFilter();
    $("syncStatus").textContent="Party data connected to Google Sheets.";
    render();
  };
  script.onerror=()=>{
    if(finished)return;
    cleanup();
    $("syncStatus").textContent="Could not connect to Google Sheets. Check deployment access.";
    render();
  };
  script.src=API_URL+"?callback="+encodeURIComponent(cb)+"&_="+Date.now();
  document.body.appendChild(script);
}

function saveParty(sno,inputId,button){
  const party=$(inputId).value.trim();
  button.disabled=true;
  const originalText=button.textContent;
  button.textContent="Saving...";
  if(!apiReady()){
    button.disabled=false;button.textContent=originalText;
    alert("Google Apps Script URL is not configured.");
    return;
  }

  const cb="partySave_"+Date.now()+"_"+Math.floor(Math.random()*10000);
  const script=document.createElement("script");
  let finished=false;

  const cleanup=()=>{
    delete window[cb];
    if(script.parentNode)script.parentNode.removeChild(script);
  };

  window[cb]=(payload)=>{
    finished=true;cleanup();
    button.disabled=false;

    if(!payload || !payload.success){
      button.textContent="Save";
      $("syncStatus").textContent="Save failed: "+(payload?.message||"Unknown error");
      alert($("syncStatus").textContent);
      return;
    }

    const rec=records.find(r=>String(r["S.No"]).trim()===String(sno).trim());
    if(rec)rec.Party=party;
    sharedParties[String(sno).trim()]=party;
    refreshPartyFilter();
    $("syncStatus").textContent="Party saved successfully to Google Sheets.";
    button.textContent="Saved";
    render();
    setTimeout(()=>{button.textContent="Save";},1500);
  };

  script.onerror=()=>{
    if(finished)return;
    cleanup();
    button.disabled=false;button.textContent="Save";
    $("syncStatus").textContent="Save request failed. Check Apps Script deployment and access.";
    alert($("syncStatus").textContent);
  };

  script.src=API_URL+
    "?action=saveParty"+
    "&sno="+encodeURIComponent(String(sno))+
    "&party="+encodeURIComponent(party)+
    "&callback="+encodeURIComponent(cb)+
    "&_="+Date.now();

  document.body.appendChild(script);
}

function fillSelect(id,key){
 const sel=$(id), vals=[...new Set(records.map(r=>value(r,key)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
 vals.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;sel.appendChild(o)});
}
fillSelect("genderFilter","Gender");
fillSelect("wardFilter","Ward");
$("total").textContent=records.length;

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function filtered(){
 const sno=$("snoSearch").value.trim().toLowerCase(), name=$("nameSearch").value.trim().toLowerCase();
 return records.filter(r=>
  (!sno||value(r,"S.No").toLowerCase().includes(sno)) &&
  (!name||value(r,"Name").toLowerCase().includes(name)) &&
  (!$("partyFilter").value||value(r,"Party")===$("partyFilter").value) &&
  (!$("genderFilter").value||value(r,"Gender")===$("genderFilter").value) &&
  (!$("wardFilter").value||value(r,"Ward")===$("wardFilter").value)
 );
}
function render(){
 const data=filtered();
 $("shown").textContent=data.length;
 $("results").textContent=`Showing ${data.length} of ${records.length} records`;
 $("empty").classList.toggle("hidden",data.length!==0);
 $("gridView").innerHTML=data.map(r=>{
  const title=value(r,"Name")||"Unnamed voter";
  const sub=[value(r,"S.No")?`S.No: ${value(r,"S.No")}`:"",value(r,"Voter ID")].filter(Boolean).join(" · ");
  const details=headers.filter(h=>!["Name","S.No","Party"].includes(h)).map(h=>`<div><small>${esc(h)}</small><span>${esc(value(r,h)||"—")}</span></div>`).join("");
  const pid="gparty_"+String(r["S.No"]).replace(/[^a-zA-Z0-9_-]/g,"_");
  return `<article class="vcard"><h3>${esc(title)}</h3><div class="sub">${esc(sub)}</div><div class="detail"><div style="grid-column:1/-1"><small>Party (editable)</small><input id="${pid}" value="${esc(value(r,"Party"))}" aria-label="Party for S.No ${esc(value(r,"S.No"))}"><button type="button" style="margin-top:6px" onclick="saveParty('${esc(value(r,"S.No"))}','${pid}',this)">Save Party</button></div>${details}</div></article>`;
 }).join("");
 $("tableHead").innerHTML="<tr>"+headers.map(h=>`<th>${esc(h)}</th>`).join("")+"</tr>";
 $("tableBody").innerHTML=data.map(r=>"<tr>"+headers.map(h=>{
    if(h==="Party"){
      const pid="tparty_"+String(r["S.No"]).replace(/[^a-zA-Z0-9_-]/g,"_");
      return `<td class="party-cell"><div class="party-editor"><input id="${pid}" value="${esc(value(r,h))}" aria-label="Party for S.No ${esc(value(r,"S.No"))}"><button type="button" onclick="saveParty('${esc(value(r,"S.No"))}','${pid}',this)">Save</button></div></td>`;
    }
    return `<td>${esc(value(r,h))}</td>`;
  }).join("")+"</tr>").join("");
}
["snoSearch","nameSearch","partyFilter","genderFilter","wardFilter"].forEach(id=>$(id).addEventListener(id.includes("Filter")?"change":"input",render));
$("resetBtn").addEventListener("click",()=>{["snoSearch","nameSearch","partyFilter","genderFilter","wardFilter"].forEach(id=>$(id).value="");render()});
$("gridBtn").addEventListener("click",()=>{$("gridView").classList.remove("hidden");$("listView").classList.add("hidden");$("gridBtn").classList.add("active");$("listBtn").classList.remove("active")});
$("listBtn").addEventListener("click",()=>{$("listView").classList.remove("hidden");$("gridView").classList.add("hidden");$("listBtn").classList.add("active");$("gridBtn").classList.remove("active")});
render();
loadSharedParties();
</script>
</body>
</html>
